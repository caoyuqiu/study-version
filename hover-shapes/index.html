<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1d1b1a;
        }
        .stage{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 56px;
            padding:56px 32px
        }
        .cube{
            width: 170px;
            height: 170px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all .3s ease;
        }
        /* 悬停时中间显示的 hover 字样 */
        .cube::after{
            content: "hover";
            font: 600 22px Arial, sans-serif;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .45);
            opacity: 0;
            transition: opacity .3s ease;
        }
        /* 悬停：上移10px，阴影偏移量变为0，显示文字 */
        .cube:hover{
            transform: translateY(-10px);
        }
        .cube:hover::after{
            opacity: 1;
        }
        /* 1. 正方形：橙红对角渐变 */
        .c1{
            background: linear-gradient(135deg,#ff9a56,#ff5e62);
            box-shadow: 0 10px 24px rgba(255, 94, 98, .35);
        }
        .c1:hover{
            box-shadow: 0 0 24px rgba(255, 94, 98, .55);
        }
        /* 2. 大圆角方形：翠绿色 */
        .c2{
            border-radius: 34px;
            background: #20d492;
            box-shadow: 0 10px 24px rgba(32, 212, 146, .35);
        }
        .c2:hover{
            box-shadow: 0 0 24px rgba(32, 212, 146, .6);
        }
        /* 3. 大圆角方形：薰衣草紫 */
        .c3{
            border-radius: 48px;
            background: #9582b9;
            box-shadow: 0 10px 24px rgba(149, 130, 185, .35);
        }
        .c3:hover{
            box-shadow: 0 0 24px rgba(149, 130, 185, .6);
        }
        /* 4. 圆形：橙黄球体径向渐变 */
        .c4{
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #ffe08a, #ffb75e 45%, #e8922f);
            box-shadow: 0 10px 24px rgba(255, 183, 94, .4);
        }
        .c4:hover{
            box-shadow: 0 0 24px rgba(255, 183, 94, .8);
        }
        /* 5. 大圆角方形：深青色 */
        .c5{
            border-radius: 26px;
            background: #4a8a85;
            box-shadow: 0 10px 24px rgba(74, 138, 133, .35);
        }
        .c5:hover{
            box-shadow: 0 0 24px rgba(74, 138, 133, .6);
        }
        /* 6. 圆形：浅紫球体径向渐变 */
        .c6{
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #c9b6ec, #8a6fd0 55%, #6d52b8);
            box-shadow: 0 10px 24px rgba(138, 111, 208, .35);
        }
        .c6:hover{
            box-shadow: 0 0 24px rgba(138, 111, 208, .6);
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="cube c1"></div>
        <div class="cube c2"></div>
        <div class="cube c3"></div>
        <div class="cube c4"></div>
        <div class="cube c5"></div>
        <div class="cube c6"></div>
    </div>
</body>
</html>
